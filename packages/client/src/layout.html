<!doctype html>
<html lang="{{lang}}" data-page="{{page}}" data-title-fr="{{titleFr}}" data-title-en="{{titleEn}}">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{{title}} — Altiplume</title>
    <meta name="description" content="{{description}}" />
    <meta name="robots" content="{{robots}}" />
    <!-- L'aperçu d'un lien partagé : une carte par langue. Les robots de partage ne
         lisent pas de JavaScript ; « ?lang=en » leur sert cet en-tête en anglais. -->
    <link rel="canonical" href="{{url}}" />
    <link rel="alternate" hreflang="fr" href="{{urlFr}}" />
    <link rel="alternate" hreflang="en" href="{{urlEn}}" />
    <link rel="alternate" hreflang="x-default" href="{{urlFr}}" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Altiplume" />
    <meta property="og:title" content="{{title}} — Altiplume" />
    <meta property="og:description" content="{{description}}" />
    <meta property="og:url" content="{{url}}" />
    <meta property="og:locale" content="{{ogLocale}}" />
    <meta property="og:locale:alternate" content="{{ogLocaleAlt}}" />
    <meta property="og:image" content="{{ogImage}}" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="{{ogImageAlt}}" />
    <meta name="twitter:card" content="summary_large_image" />
{{jsonld}}    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#cfd8dd" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#1f262c" media="(prefers-color-scheme: dark)" />
    <script src="{{theme}}"></script>
    <link rel="stylesheet" href="{{styles}}" />
    <link rel="icon" href="/icone.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Altiplume" />
    <script type="module" src="{{app}}"></script>
  </head>
  <body>
    <a class="skip" href="#contenu" data-i18n="skip">Aller au contenu</a>
    <div class="page">
      <header class="entete">
        <a class="marque" href="/" aria-label="Altiplume, accueil" data-i18n-aria="nav.home">
          <svg class="plume" viewBox="0 0 24 24" width="24" height="24" aria-hidden="true" shape-rendering="crispEdges"><rect class="px-r" x="22" y="2" width="1" height="1"/><rect class="px-k" x="16" y="3" width="6" height="1"/><rect class="px-r" x="22" y="3" width="1" height="1"/><rect class="px-k" x="13" y="4" width="1" height="1"/><rect class="px-k" x="15" y="4" width="4" height="1"/><rect class="px-l" x="19" y="4" width="1" height="1"/><rect class="px-k" x="20" y="4" width="1" height="1"/><rect class="px-r" x="22" y="4" width="1" height="1"/><rect class="px-k" x="10" y="5" width="1" height="1"/><rect class="px-k" x="12" y="5" width="3" height="1"/><rect class="px-k" x="16" y="5" width="3" height="1"/><rect class="px-l" x="19" y="5" width="1" height="1"/><rect class="px-k" x="20" y="5" width="2" height="1"/><rect class="px-k" x="10" y="6" width="2" height="1"/><rect class="px-k" x="13" y="6" width="5" height="1"/><rect class="px-l" x="18" y="6" width="1" height="1"/><rect class="px-k" x="19" y="6" width="2" height="1"/><rect class="px-k" x="9" y="7" width="4" height="1"/><rect class="px-k" x="14" y="7" width="3" height="1"/><rect class="px-l" x="17" y="7" width="1" height="1"/><rect class="px-k" x="18" y="7" width="3" height="1"/><rect class="px-k" x="7" y="8" width="2" height="1"/><rect class="px-k" x="10" y="8" width="6" height="1"/><rect class="px-l" x="16" y="8" width="1" height="1"/><rect class="px-k" x="17" y="8" width="3" height="1"/><rect class="px-k" x="7" y="9" width="3" height="1"/><rect class="px-k" x="11" y="9" width="4" height="1"/><rect class="px-l" x="15" y="9" width="1" height="1"/><rect class="px-k" x="16" y="9" width="4" height="1"/><rect class="px-k" x="7" y="10" width="7" height="1"/><rect class="px-l" x="14" y="10" width="1" height="1"/><rect class="px-k" x="15" y="10" width="4" height="1"/><rect class="px-k" x="6" y="11" width="1" height="1"/><rect class="px-k" x="8" y="11" width="5" height="1"/><rect class="px-l" x="13" y="11" width="1" height="1"/><rect class="px-k" x="14" y="11" width="4" height="1"/><rect class="px-k" x="5" y="12" width="3" height="1"/><rect class="px-k" x="9" y="12" width="3" height="1"/><rect class="px-l" x="12" y="12" width="1" height="1"/><rect class="px-k" x="13" y="12" width="4" height="1"/><rect class="px-k" x="5" y="13" width="6" height="1"/><rect class="px-l" x="11" y="13" width="1" height="1"/><rect class="px-k" x="12" y="13" width="4" height="1"/><rect class="px-k" x="5" y="14" width="5" height="1"/><rect class="px-l" x="10" y="14" width="1" height="1"/><rect class="px-k" x="11" y="14" width="3" height="1"/><rect class="px-k" x="5" y="15" width="4" height="1"/><rect class="px-l" x="9" y="15" width="1" height="1"/><rect class="px-k" x="10" y="15" width="2" height="1"/><rect class="px-k" x="5" y="16" width="2" height="1"/><rect class="px-l" x="7" y="16" width="1" height="1"/><rect class="px-k" x="8" y="16" width="1" height="1"/><rect class="px-k" x="5" y="17" width="2" height="1"/><rect class="px-k" x="5" y="18" width="1" height="1"/><rect class="px-k" x="4" y="19" width="1" height="1"/><rect class="px-k" x="3" y="20" width="1" height="1"/><rect class="px-k" x="2" y="21" width="1" height="1"/></svg>
          <span>Altiplume</span>
        </a>
        <nav aria-label="Compte" data-i18n-aria="nav.label">
          <a href="/aide" data-i18n="nav.help">Aide</a>
          <a href="/connexion" data-i18n="nav.login" data-when="anonymous">Se connecter</a>
          <a href="/aerodrome" data-i18n="nav.field" data-when="player" class="cache">Mon aérodrome</a>
          <a href="/compte" data-i18n="nav.account" data-when="player" class="cache">Mon compte</a>
          <!-- Sortir sans quitter le jeu des yeux : un téléphone se prête, un PC se partage. -->
          <button type="button" data-action="logout" data-i18n="nav.logout" data-when="player" class="cache">Sortir</button>
          <button type="button" data-action="toggle-lang" aria-label="EN: switch to English">EN</button>
          <button type="button" data-action="toggle-theme" aria-label="Passer en mode nuit" aria-pressed="false">
            <svg class="icone-soleil" viewBox="0 0 11 11" width="18" height="18" aria-hidden="true" shape-rendering="crispEdges"><rect x="5" y="0" width="1" height="2"/><rect x="5" y="9" width="1" height="2"/><rect x="0" y="5" width="2" height="1"/><rect x="9" y="5" width="2" height="1"/><rect x="1" y="1" width="1" height="1"/><rect x="9" y="1" width="1" height="1"/><rect x="1" y="9" width="1" height="1"/><rect x="9" y="9" width="1" height="1"/><rect x="4" y="3" width="3" height="1"/><rect x="3" y="4" width="5" height="3"/><rect x="4" y="7" width="3" height="1"/></svg>
            <svg class="icone-lune" viewBox="0 0 11 11" width="18" height="18" aria-hidden="true" shape-rendering="crispEdges"><rect x="4" y="1" width="3" height="1"/><rect x="3" y="2" width="2" height="1"/><rect x="2" y="3" width="2" height="5"/><rect x="3" y="8" width="2" height="1"/><rect x="4" y="9" width="4" height="1"/><rect x="8" y="8" width="1" height="1"/><rect x="7" y="2" width="1" height="1"/></svg>
          </button>
        </nav>
        <!-- Ce qui tourne, exactement : le stade du projet et la version, gravés à la
             construction. Le survol donne le commit ; la page dit ce qu'« essai » veut dire. -->
        <a class="etiquette" href="/version" title="v{{version}} · {{revision}} · {{builtOn}}">
          <span class="lecteur-seul" data-i18n="version.aria">Version et stade du projet :</span>
          <span class="etiquette-stade" data-i18n="version.stage">essai</span>
          <span class="etiquette-version">v{{version}}</span>
        </a>
      </header>
      <main id="contenu">
{{content}}
      </main>
      <footer class="pied">
        <a href="/mentions-legales" data-i18n="footer.legal">Mentions légales</a>
        <a href="/confidentialite" data-i18n="footer.privacy">Confidentialité</a>
        <a href="/cgu" data-i18n="footer.terms">Conditions d'utilisation</a>
        <a href="/aide" data-i18n="footer.help">Comment on joue</a>
        <a href="/contact" data-i18n="footer.contact">Nous écrire</a>
        <a href="/version" data-i18n="footer.version">Version</a>
        <a href="https://github.com/regis57/altiplume" rel="noopener" data-i18n="footer.source">Code source (AGPL-3.0)</a>
      </footer>
    </div>
  </body>
</html>
