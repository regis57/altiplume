name: Bug
description: Quelque chose ne fonctionne pas comme prévu
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Pour une faille de sécurité, n'utilisez pas ce formulaire : passez par le
        signalement privé (onglet Security).
  - type: textarea
    id: what
    attributes:
      label: Ce qui se passe
      description: Décrivez le comportement observé, pas votre hypothèse sur la cause.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Ce qui devrait se passer
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Comment le reproduire
      placeholder: |
        1. Ouvrir ...
        2. Cliquer sur ...
        3. Observer ...
    validations:
      required: true
  - type: input
    id: env
    attributes:
      label: Appareil et navigateur
      placeholder: iPhone 13, Safari 18 — ou Firefox 142 sous Windows 11
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Avant d'envoyer
      options:
        - label: Ma description ne contient ni mot de passe, ni jeton, ni donnée personnelle
          required: true
