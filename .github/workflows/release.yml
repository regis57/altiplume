name: Release

# Construit l'image de l'API et, sur `main`, la publie sur le registre GitHub avec
# une attestation de provenance : une preuve signée que cette image précise a été
# produite par ce dépôt, à partir de ce commit, par ce workflow.
#
# Sur une pull request, l'image est construite mais jamais publiée : c'est une
# vérification du Dockerfile, rien de plus.
#
# Avant toute publication, Trivy passe l'image au crible : une faille critique
# connue et déjà corrigée en amont bloque la publication. Le reste (élevé,
# critique sans correctif) est listé dans le résumé, pour être suivi.
#
# Sur `main`, l'image est publiée d'abord sous sa seule étiquette `sha-…`, puis
# revérifiée telle qu'elle est sur le registre, par son empreinte ; elle ne reçoit
# `latest` (ce que le NAS télécharge) qu'après. Une seconde construction n'est
# jamais tout à fait la première : c'est celle qui part qu'on vérifie.
#
# Aucune action tierce : seulement des actions `actions/*`, épinglées par SHA, et le
# client Docker fourni par le runner. Trivy n'est pas pris par son action GitHub
# (compromise en mars 2026) mais par son binaire officiel, version et empreinte
# SHA-256 fixées ici.

on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
  pull_request:
    paths:
      - Dockerfile
      - .dockerignore
      - package.json
      - package-lock.json
      - packages/server/**
      - packages/client/**
      - .github/workflows/release.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/${{ github.repository }}
  # Trivy 0.69.3 : la dernière version saine avant la compromission de mars 2026
  # (0.69.4 était piégée). Empreinte relevée dans trivy_0.69.3_checksums.txt.
  TRIVY_VERSION: "0.69.3"
  TRIVY_SHA256: "1816b632dfe529869c740c0913e36bd1629cb7688bd5634f4a858c1d57c88b75"

jobs:
  build:
    name: docker
    runs-on: ubuntu-26.04
    # Les droits d'écriture ne sont demandés que par ce job, et seulement ceux-ci.
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    outputs:
      digest: ${{ steps.push.outputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Préparer buildx
        run: docker buildx create --use --name altiplume --driver docker-container

      - name: Calculer les étiquettes
        id: meta
        env:
          REF_NAME: ${{ github.ref_name }}
          REF_TYPE: ${{ github.ref_type }}
          SHA: ${{ github.sha }}
        run: |
          short="${SHA::12}"
          first="${IMAGE}:sha-${short}"
          promote=""
          if [ "$REF_TYPE" = "tag" ]; then
            promote="${IMAGE}:${REF_NAME#v},${IMAGE}:latest"
          elif [ "$REF_NAME" = "main" ]; then
            promote="${IMAGE}:latest"
          fi
          # L'image part sous `first` ; elle ne reçoit `promote` qu'une fois revérifiée.
          echo "first=${first}" >> "$GITHUB_OUTPUT"
          echo "promote=${promote}" >> "$GITHUB_OUTPUT"
          echo "tags=${first}${promote:+,${promote}}" >> "$GITHUB_OUTPUT"
          echo "short=${short}" >> "$GITHUB_OUTPUT"
          # Ce que l'image dira d'elle-même : la version du dépôt (ou celle de
          # l'étiquette), le commit exact, la date de construction. Le client les
          # grave dans chaque page et le serveur les sert sur /v1/version.
          if [ "$REF_TYPE" = "tag" ]; then version="${REF_NAME#v}"; else version="$(node -p "require('./package.json').version")"; fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "built_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      # Construite et chargée localement d'abord, à chaque fois — PR comme main :
      # on vérifie avant de publier, jamais après.
      - name: Construire (sans publier)
        run: |
          docker buildx build \
            --platform linux/amd64 \
            --build-arg APP_VERSION="${{ steps.meta.outputs.version }}" \
            --build-arg APP_REVISION="${{ steps.meta.outputs.short }}" \
            --build-arg APP_BUILT_AT="${{ steps.meta.outputs.built_at }}" \
            --tag altiplume:verif \
            --load \
            .

      - name: Installer Trivy (binaire officiel, empreinte vérifiée)
        run: |
          curl -fsSLo "$RUNNER_TEMP/trivy.tgz" \
            "https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}/trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz"
          echo "${TRIVY_SHA256}  $RUNNER_TEMP/trivy.tgz" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/trivy"
          tar -xzf "$RUNNER_TEMP/trivy.tgz" -C "$RUNNER_TEMP/trivy" trivy
          "$RUNNER_TEMP/trivy/trivy" --version

      - name: Trivy — l'inventaire (élevé et critique)
        run: |
          "$RUNNER_TEMP/trivy/trivy" image --quiet --timeout 10m \
            --scanners vuln,secret --severity HIGH,CRITICAL \
            --format table --output trivy.txt altiplume:verif
          {
            echo "## Trivy — failles élevées et critiques de l'image"
            echo
            echo "Trivy ${TRIVY_VERSION}, base de données du jour. Seules les failles **critiques avec correctif** bloquent."
            echo
            echo '```'
            if [ -s trivy.txt ]; then cat trivy.txt; else echo "Aucune faille élevée ou critique connue."; fi
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Vérifier l'image construite (démarrage, gestionnaires de paquets, Trivy)
        run: scripts/verifier-image.sh altiplume:verif "$RUNNER_TEMP/trivy/trivy"

      - name: Se connecter au registre
        if: github.event_name != 'pull_request'
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: echo "$TOKEN" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Construire et publier
        if: github.event_name != 'pull_request'
        id: push
        env:
          FIRST: ${{ steps.meta.outputs.first }}
        run: |
          # --sbom et --provenance attachent à l'image un inventaire de ses composants
          # et une trace de construction, lisibles par `docker buildx imagetools inspect`.
          docker buildx build \
            --platform linux/amd64 \
            --build-arg APP_VERSION="${{ steps.meta.outputs.version }}" \
            --build-arg APP_REVISION="${{ steps.meta.outputs.short }}" \
            --build-arg APP_BUILT_AT="${{ steps.meta.outputs.built_at }}" \
            --sbom=true \
            --provenance=mode=max \
            --push \
            --metadata-file metadata.json \
            --tag "$FIRST" \
            .
          digest=$(jq -r '."containerimage.digest"' metadata.json)
          echo "digest=${digest}" >> "$GITHUB_OUTPUT"
          echo "Image publiée : ${IMAGE}@${digest} (étiquette ${FIRST} seulement, pour l'instant)"

      - name: Revérifier l'image publiée, prise par son empreinte
        if: github.event_name != 'pull_request'
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          docker pull --platform linux/amd64 "${IMAGE}@${DIGEST}"
          scripts/verifier-image.sh "${IMAGE}@${DIGEST}" "$RUNNER_TEMP/trivy/trivy"

      - name: Donner ses étiquettes à l'image vérifiée
        if: github.event_name != 'pull_request' && steps.meta.outputs.promote != ''
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
          PROMOTE: ${{ steps.meta.outputs.promote }}
        run: |
          IFS=',' read -ra list <<< "$PROMOTE"
          for t in "${list[@]}"; do
            docker buildx imagetools create --tag "$t" "${IMAGE}@${DIGEST}"
            # L'étiquette doit désigner exactement l'empreinte vérifiée.
            got=$(docker buildx imagetools inspect "$t" --format '{{json .Manifest}}' | jq -r '.digest')
            if [ "$got" != "$DIGEST" ]; then echo "$t désigne $got, pas $DIGEST"; exit 1; fi
            echo "$t -> $DIGEST"
          done

      - name: Attester la provenance
        if: github.event_name != 'pull_request'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

      - name: Résumé
        if: github.event_name != 'pull_request'
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          {
            echo "## Image publiée"
            echo
            echo '```'
            echo "${IMAGE}@${DIGEST}"
            echo '```'
            echo
            echo "Étiquettes : \`${TAGS//,/\`, \`}\`"
            echo
            echo "Vérifier la provenance depuis n'importe quelle machine :"
            echo
            echo '```'
            echo "gh attestation verify oci://${IMAGE}@${DIGEST} --owner ${{ github.repository_owner }}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
