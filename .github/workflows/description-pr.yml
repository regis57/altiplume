name: Description des PR

# L'outil qui ouvre les PR colle parfois sa signature en bas de la description
# (« Generated by … », un lien de session). Elle n'a pas été écrite par l'auteur :
# ce contrôle la retire à l'ouverture de chaque PR, et sait nettoyer toutes les
# anciennes d'un clic (Actions → Description des PR → Run workflow).
#
# Sécurité : `pull_request_target` lit le workflow et le script sur `main`, jamais
# dans la PR. Rien du code de la PR n'est extrait ni exécuté ; la description n'est
# lue que par le script, comme une donnée (jamais interpolée dans une commande).
on:
  pull_request_target:
    types: [opened, reopened, edited]
  workflow_dispatch:
    inputs:
      appliquer:
        description: "Réécrire vraiment les descriptions. Décoché : simple liste de ce qui changerait."
        type: boolean
        default: false

permissions: {}

concurrency:
  group: description-pr-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: false

env:
  NODE_VERSION: "22"

jobs:
  une-pr:
    name: description de la PR
    if: github.event_name == 'pull_request_target' && github.actor != 'dependabot[bot]'
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      pull-requests: write
    steps:
      # Sans `ref` : la branche de base (main), jamais le code de la PR.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Retirer la signature
        env:
          GITHUB_TOKEN: ${{ github.token }}
          NUMERO: ${{ github.event.pull_request.number }}
        run: node scripts/pr-nettoyer.mjs --pr "$NUMERO" --appliquer

  toutes:
    name: toutes les PR
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Parcourir toutes les PR
        env:
          GITHUB_TOKEN: ${{ github.token }}
          APPLIQUER: ${{ inputs.appliquer }}
        run: |
          if [ "$APPLIQUER" = "true" ]; then
            node scripts/pr-nettoyer.mjs --toutes --appliquer
          else
            node scripts/pr-nettoyer.mjs --toutes
          fi
