# Déploiement sur le Synology DS218+ (Container Manager).
#
# Principe : aucun port n'est publié sur le réseau local ni sur Internet. Le seul
# chemin d'entrée est le tunnel Cloudflare, qui ouvre une connexion sortante depuis
# le NAS. La box reste close.
#
# Le fichier .env vit À CÔTÉ de ce fichier, sur le NAS, et n'entre jamais dans Git.

services:
  api:
    image: ghcr.io/regis57/altiplume:latest
    container_name: altiplume-api
    restart: unless-stopped
    env_file: [.env]
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: "3000"
      DATABASE_PATH: /data/altiplume.db
    volumes:
      - ./data:/data
    # Le code et le système de fichiers sont immuables ; seul /data est écrivable.
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    networks: [altiplume]
    # Pas de `ports:` — volontairement. Rien n'est exposé.
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

  tunnel:
    image: cloudflare/cloudflared:latest
    container_name: altiplume-tunnel
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      # Jeton du tunnel, fourni par Cloudflare. C'est un secret : il vit dans .env.
      TUNNEL_TOKEN: ${TUNNEL_TOKEN:?définissez TUNNEL_TOKEN dans .env}
    depends_on: [api]
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    networks: [altiplume]
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

networks:
  altiplume:
    driver: bridge
